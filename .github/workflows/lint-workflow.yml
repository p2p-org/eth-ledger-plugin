name: Code style check

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:

jobs:
  job_lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Clone
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Lint
        uses: DoozyX/clang-format-lint-action@v0.15
        with:
          source: "./"
          extensions: "h,c"
          clangFormatVersion: 12.0.1
